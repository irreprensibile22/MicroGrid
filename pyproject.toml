[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microgrid"
version = "0.1.0"
description = "Gestione energetica di una microgrid: previsione ML + ottimizzazione MILP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "holidays",
    "pyomo",
    "highspy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Errori, import ordinati, sintassi moderna, errori comuni.
select = ["E", "F", "W", "I", "UP", "B"]
