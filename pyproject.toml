[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microgrid"
version = "0.1.0"
description = "Microgrid energy management: ML forecasting + MILP optimisation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pietro Ravera" }]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "lightgbm",
    "holidays",
    "pyomo",
    "highspy",
    "matplotlib",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/irreprensibile22/MicroGrid"

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Errors, sorted imports, modern syntax, common bugs.
select = ["E", "F", "W", "I", "UP", "B"]
