# Parametri di default del progetto. Nessun numero va scritto nel codice.

seed: 42

site:
  name: Costanza (DE)
  latitude: 47.66
  longitude: 9.18
  timezone: Europe/Berlin
  holidays_country: DE     # festività nazionali...
  holidays_subdivision: BW # ...e del Baden-Württemberg

time:
  step_hours: 1        # Δt
  horizon_hours: 24    # pianificazione sul giorno D+1

pv:
  peak_kw: 100.0

battery:
  capacity_kwh: 200.0      # E_max
  max_power_kw: 50.0       # P_max
  eta_charge: 0.95         # η_c
  eta_discharge: 0.95      # η_d
  soc_min_frac: 0.10       # SOC_min, frazione di E_max
  soc_max_frac: 0.90       # SOC_max, frazione di E_max
  soc_initial_frac: 0.50   # SOC_0, frazione di E_max

grid:
  max_power_kw: 100.0             # G_max, in acquisto e in vendita
  # Oneri, tasse e costi di rete sull'energia acquistata (τ): valore assunto.
  # Prezzo di acquisto = day-ahead + τ; prezzo di vendita = day-ahead.
  import_surcharge_eur_kwh: 0.20

objective:
  carbon_weight_eur_kg: 0.0       # λ; 0 = si minimizza il solo costo

paths:
  raw: data/raw
  processed: data/processed
  models: models
  results: results

# --- Dati -------------------------------------------------------------------

data:
  # Periodo di studio (date locali, estremi inclusi). È la finestra in cui
  # tutte le utenze scelte hanno misure complete.
  start: "2015-11-01"
  end: "2018-02-03"

load:
  source_url: https://data.open-power-system-data.org/household_data/2020-04-15/household_data_60min_singleindex.csv
  # Utenze di Costanza sommate per formare il carico della microgrid.
  # Il consumo di ciascuna è: grid_import + pv − grid_export (colonne presenti).
  households:
    - import: DE_KN_residential4_grid_import   # fotovoltaico dietro il contatore
      pv: DE_KN_residential4_pv
      export: DE_KN_residential4_grid_export
    - import: DE_KN_residential5_grid_import   # senza fotovoltaico
  # Il carico aggregato reale (picco di pochi kW) viene riscalato a questo
  # picco per essere coerente con la taglia dell'impianto.
  # null = nessuna riscalatura.
  scale_to_peak_kw: 50.0

cleaning:
  # Buchi fino a questa durata vengono interpolati; i giorni che contengono
  # buchi più lunghi (anche già interpolati dal fornitore dei dati) sono
  # marcati come non validi.
  max_gap_hours: 6

split:
  # Divisione in ordine temporale, per giorni interi. Il resto è il test set.
  train: 0.70
  validation: 0.15

pvgis:
  url: https://re.jrc.ec.europa.eu/api/v5_3/seriescalc
  loss_percent: 14.0    # perdite di sistema
  tilt_deg: 35.0        # inclinazione dei moduli
  azimuth_deg: 0.0      # 0 = sud

weather:
  url: https://archive-api.open-meteo.com/v1/archive
  variables: [temperature_2m, shortwave_radiation, cloud_cover]

market:
  url: https://api.energy-charts.info
  # Nel periodo di studio la Germania era nella zona di mercato DE-AT-LU
  # (divisa in DE-LU e AT dal 1° ottobre 2018).
  bidding_zone: DE-AT-LU
  country: de

# Fattori di emissione sul ciclo di vita [gCO2eq/kWh].
# Fonte: IPCC AR5 WG3, Annex III, tabella A.III.2 (valori mediani).
# Il rapporto non distingue lignite e carbone: si usa 820 per entrambi.
# Olio, rifiuti e "altro" non sono nella tabella: valori assunti.
emission_factors:
  Nuclear: 12
  Hydro Run-of-River: 24
  Hydro water reservoir: 24
  Hydro pumped storage: 24
  Biomass: 230
  Fossil brown coal / lignite: 820
  Fossil hard coal: 820
  Fossil coal-derived gas: 820
  Fossil oil: 650        # assunto
  Fossil gas: 490
  Geothermal: 38
  Others: 700            # assunto
  Waste: 700             # assunto
  Wind offshore: 12
  Wind onshore: 11
  Solar: 45

# --- Previsione --------------------------------------------------------------

forecast:
  # La previsione del giorno D+1 è emessa alla mezzanotte locale fra D e D+1:
  # usa solo misure fino alla fine del giorno D.
  lags_hours: [24, 48, 168]
  # Numero minimo di giorni validi per calcolare la media dei 7 giorni precedenti.
  min_days_weekly_mean: 4
  cv_folds: 4                  # finestre espandibili sui dati di addestramento
  # Durante validazione e test il modello viene riaddestrato ogni N giorni con
  # tutte le misure disponibili fino a quel momento.
  refit_every_days: 7
  max_boosting_rounds: 3000
  early_stopping_rounds: 100
  # Parametri fissi di LightGBM.
  base_params:
    objective: regression
    learning_rate: 0.03
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
  # Griglia degli iperparametri: si provano tutte le combinazioni.
  grid:
    num_leaves: [7, 15, 31]
    min_child_samples: [20, 50, 100]
    reg_lambda: [0.0, 10.0]

# --- Ottimizzazione ----------------------------------------------------------

optimize:
  solver: highs
  rel_gap: 1.0e-6              # scarto relativo massimo dall'ottimo
  time_limit_s: 60
  # Giorno (data locale) disegnato da `python -m microgrid.optimize`.
  example_day: "2017-09-12"

# --- Simulazione -------------------------------------------------------------

simulate:
  split: test                  # periodo simulato: validation o test

# --- Confronti ---------------------------------------------------------------

evaluate:
  # Pesi λ [EUR/kgCO2] con cui si ripete la simulazione per il fronte di Pareto.
  pareto_carbon_weights: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0]
  # Analisi di sensitività: si cambia un parametro alla volta, gli altri
  # restano ai valori di default. La potenza della batteria non cambia.
  sensitivity:
    battery_capacity_kwh: [50.0, 100.0, 200.0, 400.0]
    pv_peak_kw: [50.0, 100.0, 150.0, 200.0]
    import_surcharge_eur_kwh: [0.0, 0.05, 0.10, 0.20, 0.30]
