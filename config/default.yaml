# Default project parameters. No number should be hard-coded elsewhere.

seed: 42

site:
  name: Konstanz (DE)
  latitude: 47.66
  longitude: 9.18
  timezone: Europe/Berlin
  holidays_country: DE     # national holidays...
  holidays_subdivision: BW # ...plus those of Baden-Württemberg

time:
  step_hours: 1        # Δt
  horizon_hours: 24    # planning covers day D+1

pv:
  peak_kw: 100.0

battery:
  capacity_kwh: 200.0      # E_max
  max_power_kw: 50.0       # P_max
  eta_charge: 0.95         # η_c
  eta_discharge: 0.95      # η_d
  soc_min_frac: 0.10       # SOC_min, as a fraction of E_max
  soc_max_frac: 0.90       # SOC_max, as a fraction of E_max
  soc_initial_frac: 0.50   # SOC_0, as a fraction of E_max

grid:
  max_power_kw: 100.0             # G_max, for both import and export
  # Levies, taxes and network charges on imported energy (τ): an assumed value.
  # Buy price = day-ahead + τ; sell price = day-ahead.
  import_surcharge_eur_kwh: 0.20

objective:
  carbon_weight_eur_kg: 0.0       # λ; 0 = minimise cost only

paths:
  raw: data/raw
  processed: data/processed
  models: models
  results: results

# --- Data --------------------------------------------------------------------

data:
  # Study period (local dates, both ends included). It is the window in which
  # all the chosen households have complete measurements.
  start: "2015-11-01"
  end: "2018-02-03"

load:
  source_url: https://data.open-power-system-data.org/household_data/2020-04-15/household_data_60min_singleindex.csv
  # Households in Konstanz, summed to form the microgrid load.
  # Each one's consumption is: grid_import + pv − grid_export (columns present).
  households:
    - import: DE_KN_residential4_grid_import   # PV behind the meter
      pv: DE_KN_residential4_pv
      export: DE_KN_residential4_grid_export
    - import: DE_KN_residential5_grid_import   # no PV
  # The real aggregate load (a peak of a few kW) is rescaled to this peak so
  # that it matches the size of the plant. null = no rescaling.
  scale_to_peak_kw: 50.0

cleaning:
  # Gaps up to this length are interpolated; days containing longer gaps
  # (including ones already interpolated by the data provider) are flagged
  # as invalid.
  max_gap_hours: 6

split:
  # Chronological split, by whole days. Whatever is left is the test set.
  train: 0.70
  validation: 0.15

pvgis:
  url: https://re.jrc.ec.europa.eu/api/v5_3/seriescalc
  loss_percent: 14.0    # system losses
  tilt_deg: 35.0        # module tilt
  azimuth_deg: 0.0      # 0 = south

weather:
  url: https://archive-api.open-meteo.com/v1/archive
  variables: [temperature_2m, shortwave_radiation, cloud_cover]

market:
  url: https://api.energy-charts.info
  # During the study period Germany was in the DE-AT-LU bidding zone
  # (split into DE-LU and AT on 1 October 2018).
  bidding_zone: DE-AT-LU
  country: de

# Life-cycle emission factors [gCO2eq/kWh].
# Source: IPCC AR5 WG3, Annex III, table A.III.2 (median values).
# The report does not separate lignite from hard coal: 820 is used for both.
# Oil, waste and "others" are not in the table: assumed values.
emission_factors:
  Nuclear: 12
  Hydro Run-of-River: 24
  Hydro water reservoir: 24
  Hydro pumped storage: 24
  Biomass: 230
  Fossil brown coal / lignite: 820
  Fossil hard coal: 820
  Fossil coal-derived gas: 820
  Fossil oil: 650        # assumed
  Fossil gas: 490
  Geothermal: 38
  Others: 700            # assumed
  Waste: 700             # assumed
  Wind offshore: 12
  Wind onshore: 11
  Solar: 45

# --- Forecast ----------------------------------------------------------------

forecast:
  # The forecast for day D+1 is issued at local midnight between D and D+1:
  # it only uses measurements up to the end of day D.
  lags_hours: [24, 48, 168]
  # Minimum number of valid days needed for the mean of the previous 7 days.
  min_days_weekly_mean: 4
  cv_folds: 4                  # expanding windows on the training data
  # During validation and test the model is refitted every N days on all the
  # measurements available up to then.
  refit_every_days: 7
  max_boosting_rounds: 3000
  early_stopping_rounds: 100
  # Fixed LightGBM parameters.
  base_params:
    objective: regression
    learning_rate: 0.03
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
  # Hyperparameter grid: every combination is tried.
  grid:
    num_leaves: [7, 15, 31]
    min_child_samples: [20, 50, 100]
    reg_lambda: [0.0, 10.0]

# --- Optimisation ------------------------------------------------------------

optimize:
  solver: highs
  rel_gap: 1.0e-6              # largest relative gap from the optimum
  time_limit_s: 60
  # Day (local date) plotted by `python -m microgrid.optimize`.
  example_day: "2017-09-12"

# --- Simulation --------------------------------------------------------------

simulate:
  split: test                  # simulated period: validation or test

# --- Comparison --------------------------------------------------------------

evaluate:
  # Weights λ [EUR/kgCO2] the simulation is repeated with for the Pareto front.
  pareto_carbon_weights: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0]
  # Sensitivity analysis: one parameter changes at a time, the others stay at
  # their defaults. The battery power does not change.
  sensitivity:
    battery_capacity_kwh: [50.0, 100.0, 200.0, 400.0]
    pv_peak_kw: [50.0, 100.0, 150.0, 200.0]
    import_surcharge_eur_kwh: [0.0, 0.05, 0.10, 0.20, 0.30]
